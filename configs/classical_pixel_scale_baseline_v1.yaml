schema_version: 1
experiment_id: H1-CLASSICAL-POINT-GEOMETRY
validation_release: data/simulations/reliability-pixel-scale-v1-final
baseline_cnn_predictions: results/reports/reliability_v1/pixel_scale/frozen_baseline/predictions.csv
training_release: data/simulations/sim-eng1000-v1
validation_interventions:
  canonical: canonical
  low: pixel-scale-004
  high: pixel-scale-006
peak_detection:
  threshold_snr: 5.0
  center_smoothing_sigma_arcsec: 0.15
  lens_center_search_radius_arcsec: 0.35
  central_exclusion_radius_arcsec: 0.25
  outer_detection_radius_arcsec: 2.25
  minimum_peak_separation_arcsec: 0.30
  maximum_peaks: 4
lens_equation:
  model: SIS_for_2_images_SIE_for_3_or_4_images
  theta_E_bounds_arcsec: [0.25, 2.25]
  axis_ratio_bounds: [0.3, 1.0]
  orientation_bounds_rad: [0.0, 3.141592653589793]
  source_position_bounds_arcsec: [-0.5, 0.5]
  max_function_evaluations: 50
fallback:
  statistic: training_mean_theta_E_arcsec
  source_split: train
bootstrap:
  resamples: 10000
  seed: 6031
  practical_effect_arcsec: 0.01
