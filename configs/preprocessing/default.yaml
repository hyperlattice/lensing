schema_version: "2.0"
preprocessing_version: "2.0.0"

science:
  hdu: auto
  require_two_dimensional: true

geometry:
  target_shape: [256, 256]
  centering: image_center
  coordinate_convention: image_y_x_zero_based_pixel_centers
  pad_value: 0.0

background:
  method: robust_scalar_sigma_clip
  sigma_clip: 4.0
  max_iterations: 5
  min_valid_pixels: 64
  valid_pixel_policy: exclude_nonfinite

mask:
  invalid_value_policy: mark_nonfinite
  padding_is_covered: false

variance:
  method: toy_scalar_background
  noise_floor: 0.000001
  correlation_assumption: independent_pixels_approximation

normalization:
  method: masked_percentile
  lower_percentile: 1.0
  upper_percentile: 99.0
  invalid_fill: 0.0

outputs:
  normalized_subdir: normalized
  science_subdir: science
  mask_subdir: masks
  variance_subdir: variance
  geometry_subdir: geometry
  background_subdir: background
  transform_subdir: transforms
  noise_subdir: noise
  overwrite: false

run:
  record_failures: true
  write_manifest_only_after_success: true
