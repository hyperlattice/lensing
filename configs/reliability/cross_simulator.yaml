schema_version: 1
experiment_id: WEEK7-INDEPENDENT-SIE-LENS-EQUATION
protocol: archive/docs/reliability_study/protocol_v1.7.md
training_release: data/simulations/sim-eng1000-v1
validation_split: data/simulations/sim-eng1000-v1/splits/validation.csv
matched_validation_parent_count: 150
model_checkpoints:
  - results/ml/theta-e-cnn-seeds-v1/seed-12001/best.pt
  - results/ml/theta-e-cnn-seeds-v1/seed-12002/best.pt
  - results/ml/theta-e-cnn-seeds-v1/seed-12003/best.pt
conditions:
  - condition_id: independent-canonical
    exposure_time_multiplier: 1.0
  - condition_id: independent-exposure-half
    exposure_time_multiplier: 0.5
rendering:
  independent_mass_equation: closed_form_singular_isothermal_ellipsoid
  shared_light_evaluator: lenstronomy.LightModel.SERSIC_ELLIPSE
  pixel_shape: [256, 256]
  pixel_scale_arcsec: 0.05
  supersampling_factor: 2
  noise_seed_policy: reuse_parent_noise_seed
  psf_family: gaussian
control_gate:
  deflection_grid_theta_e_arcsec: 1.15
  deflection_grid_axis_ratios: [1.0, 0.95, 0.7, 0.5]
  deflection_grid_orientations_rad: [0.0, 0.3, 1.2, 2.6]
  deflection_grid_center_arcsec: [0.1, -0.08]
  deflection_max_component_difference_arcsec: 0.000001
  minimum_root_count_agreement_fraction: 0.95
  maximum_hungarian_matched_position_error_arcsec: 0.02
  renderer_smoke_parent_count: 4
metrics:
  bootstrap_resamples: 10000
  bootstrap_seed: 6031
  practical_effect_arcsec: 0.01
  target_field: theta_E_arcsec
historical_test_accessed: false
