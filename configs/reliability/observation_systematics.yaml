schema_version: 1
benchmark_version: reliability-counterfactual-v1
parent_manifest: data/simulations/sim-eng1000-v1/manifest.csv
split_manifests:
  train: data/simulations/sim-eng1000-v1/splits/train.csv
  validation: data/simulations/sim-eng1000-v1/splits/validation.csv
selection_seed: 6031
max_parents_per_split:
  train: 1
  validation: 150
require_canonical: true
model_checkpoints:
  - results/ml/theta-e-cnn-seeds-v1/seed-12001/best.pt
  - results/ml/theta-e-cnn-seeds-v1/seed-12002/best.pt
  - results/ml/theta-e-cnn-seeds-v1/seed-12003/best.pt
metrics:
  bootstrap_resamples: 10000
  bootstrap_seed: 6031
  practical_effect_arcsec: 0.01
interventions:
  - intervention_id: canonical
    family: canonical
    overrides: {}
  - intervention_id: psf-width-075
    family: psf_width
    overrides:
      psf_fwhm_arcsec:
        multiply: 0.75
  - intervention_id: psf-width-125
    family: psf_width
    overrides:
      psf_fwhm_arcsec:
        multiply: 1.25
  - intervention_id: noise-repeat-1
    family: noise_realization
    overrides: {}
    noise_seed_offset: 1
  - intervention_id: noise-repeat-2
    family: noise_realization
    overrides: {}
    noise_seed_offset: 2
  - intervention_id: exposure-half
    family: exposure
    overrides:
      exposure_time:
        multiply: 0.5
  - intervention_id: read-noise-double
    family: read_noise
    overrides:
      read_noise_electrons:
        multiply: 2.0
  - intervention_id: lens-light-zero
    family: lens_light
    overrides:
      lens_light_amp:
        value: 0.0
  - intervention_id: lens-light-double
    family: lens_light
    overrides:
      lens_light_amp:
        multiply: 2.0
  - intervention_id: normalization-affine
    family: normalization
    overrides: {}
    preprocessing:
      normalization_method: affine
  - intervention_id: normalization-percentile
    family: normalization
    overrides: {}
    preprocessing:
      normalization_method: masked_percentile
      lower_percentile: 1.0
      upper_percentile: 99.0
