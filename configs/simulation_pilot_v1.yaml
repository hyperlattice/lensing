schema_version: "2.0"
simulation_version: "0.1.0"

backend:
  name: lenstronomy
  version: "1.14.2"
  numba_jit: local_default_disabled_for_reproducible_pilot

conventions:
  coordinate_order: [x_arcsec, y_arcsec]
  image_index_order: [y_pixel, x_pixel]
  angle_unit: arcsec
  orientation_unit: radian
  axis_ratio: minor_over_major
  ellipticity_parameterization: "e=(1-q)/(1+q), e1=e*cos(2*phi), e2=e*sin(2*phi)"

models:
  control_lens: SIS
  primary_lens: SIE
  source_light: SERSIC_ELLIPSE
  point_source: UNLENSED
  psf: GAUSSIAN

grid:
  shape: [256, 256]
  pixel_scale_arcsec: 0.05
  center: [0.0, 0.0]

preprocessing:
  # Sparse point images are not suitable for percentile scaling: a 99th
  # percentile can be zero and erase the signal. Keep P10 normalized values
  # equal to the background-subtracted science control.
  normalization_method: none
  lower_percentile: 1.0
  upper_percentile: 99.0
  background_sigma_clip: 4.0
  background_max_iterations: 5
  background_min_valid_pixels: 64
  noise_floor: 0.000001

pilot:
  sis_control:
    theta_E_arcsec: [0.5, 2.0]
    source_radius_arcsec: [0.1, 0.4]
    source_flux: 1.0
  sie_extended:
    theta_E_arcsec: [0.5, 2.0]
    q: [0.5, 0.95]
    lens_center_offset_arcsec: [-0.2, 0.2]
    source_position_arcsec: [-0.35, 0.35]
    source_q: [0.4, 1.0]
    source_n: [0.5, 4.0]
    source_re_arcsec: [0.05, 0.3]
    source_amp: [0.5, 2.0]
    supersampling_factor: 2
  observation:
    lens_light_q: [0.5, 1.0]
    lens_light_n: [1.0, 4.0]
    lens_light_re_arcsec: [0.15, 0.6]
    lens_light_amp: [0.02, 0.2]
    point_source_amp: [0.2, 1.0]
  observation_effects:
    psf_fwhm_arcsec: [0.1, 0.2]
    background_rate: [0.01, 0.05]
    read_noise_electrons: [1.0, 3.0]
    exposure_time: [80.0, 120.0]
    detectable_amplitude_threshold: 0.05
  stress:
    shear_amplitude: [0.0, 0.08]
    quad_source_position_arcsec: [-0.08, 0.08]
    quad_q: [0.45, 0.75]
    quad_shear_amplitude: [0.04, 0.08]
    lens_light_q: [0.35, 1.0]
    lens_light_n: [0.7, 6.0]
    lens_light_re_arcsec: [0.10, 0.8]
    lens_light_amp: [0.01, 0.35]
    point_source_amp: [0.10, 1.5]
    source_amp: [0.25, 3.0]
    psf_fwhm_arcsec: [0.08, 0.25]
    background_rate: [0.005, 0.08]
    read_noise_electrons: [0.5, 5.0]
    exposure_time: [60.0, 160.0]
    supersampling_factor: [1, 3]

  stages:
    - name: sis_controls
      count: 10
    - name: sie_extended_source
      count: 20
    - name: sie_point_source_psf_noise
      count: 30
  seed_namespace: lensing-simulation-v1
  write_truth_parameters: true
  write_reproducibility_record: true
