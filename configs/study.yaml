  holdout: data/simulations/reliability-blind-holdout-v1/splits/holdout.csv
  arms: [C, G, R]
  conditions:
    - canonical
    - pixel-scale-004
    - pixel-scale-006
    - exposure-half
    - read-noise-double
  bootstrap:
    resamples: 10000
    stress_seed: 8731
    canonical_seed: 8732
  training:
    optimizer_updates: 880
    validation_interval_updates: 440
    batch_size: 16
    torch_threads: 6
    learning_rate: 0.001
    weight_decay: 0.0001
