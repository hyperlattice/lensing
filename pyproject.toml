[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "charlie-lensing-study"
version = "0.1.0"
description = "Paired synthetic Einstein-radius robustness study"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "scipy>=1.11",
    "lenstronomy==1.14.2",
    "astropy>=6.0",
    "tqdm>=4.66",
    "torch>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.17.4"]
autolens = [
    "autolens==2026.10.26.1",
    "autogalaxy==2026.10.26.1",
    "autoarray==2026.10.26.1",
    "autofit==2026.10.26.1",
    "autonerves==2026.10.26.1",
]

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
